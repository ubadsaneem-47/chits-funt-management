        }

    </style>

    <script>


        /* =====================================================
           LOAD DATA
        ===================================================== */

        let chitPickers =

            JSON.parse(
                localStorage.getItem(
                    "chitPickers"
                )
            ) || [];


        let selectedChitId =

            localStorage.getItem(
                "selectedChitId"
            );


        let chit =

            chitPickers.find(
                function (item) {

                    return String(
                        item.id
                    ) ===
                    String(
                        selectedChitId
                    );

                }
            );



        /* =====================================================
           CHECK GROUP
        ===================================================== */

        if (!chit) {


            document.getElementById(
                "pageContent"
            ).innerHTML = `

                <div class="no-group">

                    <div class="no-group-icon">
                        🏆
                    </div>

                    <h2>
                        No ChitPicker Selected
                    </h2>

                    <p>
                        Please select a ChitPicker
                        from the Dashboard first.
                    </p>

                    <a href="dashboard.html">
                        Go to Dashboard
                    </a>

                </div>

            `;


        } else {


            initialize();

        }



        /* =====================================================
           INITIALIZE
        ===================================================== */

        function initialize() {


            if (
                !Array.isArray(
                    chit.memberList
                )
            ) {

                chit.memberList = [];

            }


            if (
                !Array.isArray(
                    chit.winnerHistory
                )
            ) {

                chit.winnerHistory = [];

            }


            displayPage();

        }



        /* =====================================================
           SAVE
        ===================================================== */

        function saveData() {


            const index =
                chitPickers.findIndex(
                    function (item) {

                        return String(
                            item.id
                        ) ===
                        String(
                            chit.id
                        );

                    }
                );


            if (index !== -1) {

                chitPickers[index] =
                    chit;

            }


            localStorage.setItem(
                "chitPickers",
                JSON.stringify(
                    chitPickers
                )
            );

        }



        /* =====================================================
           DISPLAY PAGE
        ===================================================== */

        function displayPage() {


            const totalMembers =
                chit.memberList.length;


            const totalWinners =
                chit.winnerHistory.length;


            const remaining =
                Math.max(
                    0,
                    totalMembers -
                    totalWinners
                );


            const monthlyPayment =
                Number(
                    chit.monthlyPayment ||
                    0
                );


            const totalCollection =
                totalMembers *
                monthlyPayment;


            const currentMonth =
                totalWinners + 1;


            document.getElementById(
                "adminTop"
            ).textContent =
                chit.adminName ||
                "Admin";


            document.getElementById(
                "adminAvatar"
            ).textContent =
                (
                    chit.adminName ||
                    "A"
                )
                .charAt(0)
                .toUpperCase();



            document.getElementById(
                "pageContent"
            ).innerHTML = `


                <!-- GROUP HEADER -->

                <section
                    class="group-header">


                    <div class="group-title">


                        <div class="group-icon">

                            🏆

                        </div>


                        <div>


                            <h2>

                                ${escapeHTML(
                                    chit.groupName ||
                                    "ChitPicker"
                                )}

                            </h2>


                            <p>

                                Admin:

                                <strong>

                                    ${escapeHTML(
                                        chit.adminName ||
                                        "-"
                                    )}

                                </strong>

                            </p>


                        </div>


                    </div>



                    <div
                        class="group-details">


                        <div
                            class="detail">

                            <strong>

                                ₹${monthlyPayment.toLocaleString(
                                    "en-IN"
                                )}

                            </strong>

                            <span>
                                MONTHLY PAYMENT
                            </span>

                        </div>


                        <div
                            class="detail">

                            <strong>

                                ${chit.duration || 0}

                            </strong>

                            <span>
                                MONTHS
                            </span>

                        </div>


                        <div
                            class="detail">

                            <strong>

                                ${totalMembers}

                            </strong>

                            <span>
                                MEMBERS
                            </span>

                        </div>


                    </div>


                </section>



                <!-- SUMMARY -->

                <section
                    class="summary">


                    <div
                        class="summary-card">

                        <small>
                            TOTAL WINNERS
                        </small>

                        <h2>

                            ${totalWinners}

                        </h2>

                    </div>


                    <div
                        class="summary-card">

                        <small>
                            REMAINING MEMBERS
                        </small>

                        <h2>

                            ${remaining}

                        </h2>

                    </div>


                    <div
                        class="summary-card">

                        <small>
                            CURRENT MONTH
                        </small>

                        <h2>

                            ${
                                remaining > 0
                                ?
                                "Month " +
                                currentMonth
                                :
                                "Completed"
                            }

                        </h2>

                    </div>


                    <div
                        class="summary-card">

                        <small>
                            TOTAL COLLECTION
                        </small>

                        <h2>

                            ₹${totalCollection.toLocaleString(
                                "en-IN"
                            )}

                        </h2>

                    </div>


                </section>



                <!-- WINNER HISTORY -->

                <section class="card">


                    <div
                        class="card-header">


                        <div>

                            <h3>
                                🏆 Winner History
                            </h3>

                            <p>
                                All winners selected
                                from the spin picker
                            </p>

                        </div>


                        <div
                            class="header-buttons">


                            <button
                                class="btn print-btn"
                                onclick="window.print()">

                                🖨 Print

                            </button>


                            <button
                                class="btn dashboard-btn"
                                onclick="goDashboard()">

                                Dashboard

                            </button>


                        </div>


                    </div>

                    <div class="search">

                        <input
                            type="text"
                            id="winnerSearch"
                            placeholder="🔍 Search winner by name, ID or month..."
                            onkeyup="searchWinners()">

                    </div>



                    <!-- TABLE -->

                    <div
                        class="table-wrapper">


                        <table>


                            <thead>

                                <tr>

                                    <th>
                                        #
                                    </th>

                                    <th>
                                        WINNER
                                    </th>

                                    <th>
                                        MONTH
                                    </th>

                                    <th>
                                        WINNING DATE
                                    </th>

                                    <th>
                                        AMOUNT RECEIVED
                                    </th>

                                    <th>
                                        STATUS
                                    </th>

                                </tr>

                            </thead>


                            <tbody
                                id="winnerTable">

                            </tbody>

                    </div>


                </section>

            `;


            displayWinners(
                chit.winnerHistory
            );

        /* =====================================================
           DISPLAY WINNERS
        ===================================================== */

        function displayWinners(
            winners
        ) {


            const table =
                document.getElementById(
                    "winnerTable"
                );


            if (!table) {

                return;

            }


            table.innerHTML = "";


            if (
                winners.length === 0
            ) {


                table.innerHTML = `

                    <tr>

                        <td
                            colspan="6">

                            <div
                                class="empty">

                                <div
                                    class="empty-icon">

                                    🏆

                                </div>

                                <h3>
                                    No Winners Yet
                                </h3>

                                <p>

                                    Spin the picker
                                    to select the
                                    first winner.

                                </p>

                            </div>

                        </td>

                    </tr>

                `;


                return;

            }



            winners.forEach(
                function (
                    winner,
                    index
                ) {


                    const name =
                        winner.name ||
                        "Unknown";


                    const initial =
                        name
                        .charAt(0)
                        .toUpperCase();


                    const amount =
                        Number(
                            chit.monthlyPayment ||
                            0
                        );



                    const row =
                        document.createElement(
                            "tr"
                        );



                    row.innerHTML = `

                        <td>

                            ${index + 1}

                        </td>


                        <td>

                            <div
                                class="winner-info">


                                <div
                                    class="winner-avatar">

                                    ${escapeHTML(
                                        initial
                                    )}

                                </div>


                                <div>


                                    <div
                                        class="winner-name">

                                        ${escapeHTML(
                                            name
                                        )}

                                    </div>


                                    <div
                                        class="member-id">

                                        Member ID:

                                        ${escapeHTML(
                                            winner.id ||
                                            "-"
                                        )}

                                    </div>


                                </div>


                            </div>

                        </td>


                        <td>

                            <span
                                class="month">

                                Month
                                ${escapeHTML(
                                    winner.month ||
                                    index + 1
                                )}

                            </span>

                        </td>


                        <td>

                            ${escapeHTML(
                                winner.date ||
                                "-"
                            )}

                        </td>


                        <td>

                            <span
                                class="amount">

                                ₹${amount.toLocaleString(
                                    "en-IN"
                                )}

                            </span>

                        </td>


                        <td>

                            <span
                                class="trophy">

                                🏆

                            </span>

                            <strong>
                                WON
                            </strong>

                        </td>

                    `;


                    table.appendChild(
                        row
                    );

                }
            );

        }



        /* =====================================================
           SEARCH
        ===================================================== */

        function searchWinners() {


            const input =
                document.getElementById(
                    "winnerSearch"
                );


            if (!input) {

                return;

            }


            const search =
                input.value
                .toLowerCase()
                .trim();


            const filtered =
                chit.winnerHistory.filter(
                    function (winner) {


                        const name =
                            String(
                                winner.name ||
                                ""
                            )
                            .toLowerCase();


                        const id =
                            String(
                                winner.id ||
                                ""
                            )
                            .toLowerCase();


                        const month =
                            String(
                                winner.month ||
                                ""
                            )
                            .toLowerCase();


                        return (

                            name.includes(
                                search
                            )

                            ||

                            id.includes(
                                search
                            )

                            ||

                            month.includes(
                                search
                            )

                        );

                    }
                );


            displayWinners(
                filtered
            );

        }



        /* =====================================================
           DASHBOARD
        ===================================================== */

        function goDashboard() {

            window.location.href =
                "dashboard.html";

        }



        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

        }



        /* =====================================================
           UPDATE WHEN PICKER CHANGES DATA
        ===================================================== */

        window.addEventListener(
            "storage",
            function (event) {


                if (
                    event.key ===
                    "chitPickers"
                ) {


                    chitPickers =
                        JSON.parse(
                            event.newValue
                        ) || [];


                    chit =
                        chitPickers.find(
                            function (item) {

                                return String(
                                    item.id
                                ) ===
                                String(
                                    selectedChitId
                                );

                            }
                        );


                    if (chit) {

                        displayPage();

                    }

                }

            }
        );


    </script>


</body>

</html>
